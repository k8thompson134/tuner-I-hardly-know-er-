<!DOCTYPE html>
<html>
  <head>
    <title>Signal Tuner</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./css/style.css" />
  </head>
  <body>
    <div id="page">
      <div id="player-wrapper">
        <div id="webamp-mount"></div>
      </div>
      <div id="tuner-panel">
        <div id="panel-header">
          <div id="status-readout" role="status" aria-live="polite" aria-atomic="true">Loading transmission&hellip;</div>
          <div id="panel-controls">
            <div id="scale-controls">
              <span class="control-label">SCALE</span>
              <button type="button" class="scale-btn" data-scale="1">1x</button>
              <button type="button" class="scale-btn" data-scale="1.2">1.2x</button>
              <button type="button" class="scale-btn active" data-scale="1.35">1.35x</button>
              <button type="button" class="scale-btn" data-scale="1.5">1.5x</button>
            </div>
          </div>
        </div>
        <div id="layer-hud" role="region" aria-live="polite" aria-label="Resonance filter status"></div>
        <div id="instructions">
          Drag the <strong>600</strong> band on the Winamp equalizer to tune.
          Decoded words appear in the title bar.
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
